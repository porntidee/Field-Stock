<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Stock</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

.header {
  background: #1f2937;
  color: white;
  padding: 20px;
  text-align: center;
}

.header h1 { margin: 0 0 5px; }

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.btn-add { background: #16a34a; color: white; }
.btn-issue { background: #dc2626; color: white; }
.btn-list { background: #2563eb; color: white; }
.btn-back { background: #6b7280; color: white; }

input, select, textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  margin-bottom: 12px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 15px;
}

label { font-weight: bold; }

.item {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}

.item strong { font-size: 17px; }

.hidden { display: none; }

.summary {
  display: flex;
  gap: 10px;
}

.summary-box {
  flex: 1;
  background: #f9fafb;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
}

.summary-number {
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>📦 Field Stock</h1>
  <div>ระบบจัดการสต๊อกอุปกรณ์ภาคสนาม</div>
</div>

<div class="container">

  <!-- หน้าหลัก -->
  <div id="homePage">

    <div class="card">
      <h2>📋 จัดการสต๊อก</h2>

      <button class="btn-add" onclick="showPage('addPage')">
        ➕ เพิ่มอุปกรณ์
      </button>

      <button class="btn-issue" onclick="showIssuePage()">
        📤 เบิกอุปกรณ์
      </button>

      <button class="btn-list" onclick="showStock()">
        📦 ดูรายการอุปกรณ์
      </button>

      <button class="btn-list" onclick="showHistory()">
        📋 ประวัติการเบิก
      </button>

      <button class="btn-add" onclick="showReceivePage()">
        📥 รับอุปกรณ์เข้า
      </button>

      <button class="btn-add" onclick="showReceiveHistory()">
        📋 ประวัติการรับเข้า
      </button>
    
      <button class="btn-list" onclick="showImportPage()">
        📥 นำเข้า Excel
      </button>
    </div>

    <div class="card">
      <h2>📊 สรุปสต๊อก</h2>

      <div class="summary">
        <div class="summary-box">
          <div>รายการ</div>
          <div class="summary-number" id="itemCount">0</div>
        </div>

        <div class="summary-box">
          <div>จำนวนรวม</div>
          <div class="summary-number" id="totalQuantity">0</div>
        </div>
      </div>
    </div>

  </div>

  
  <!-- เพิ่มอุปกรณ์ -->
  <div id="addPage" class="hidden">
    <div class="card">
      <h2>➕ เพิ่มอุปกรณ์</h2>

      <label>ชื่ออุปกรณ์ *</label>
      <input id="name" placeholder="เช่น MRV336">

      <label>รุ่น / Model</label>
      <input id="model" placeholder="เช่น MRV336">

      <label>จำนวน *</label>
      <input id="quantity" type="number" min="1" placeholder="จำนวน">

      <label>หน่วย</label>
      <select id="unit">
        <option>ชิ้น</option>
        <option>ตัว</option>
        <option>ชุด</option>
        <option>อัน</option>
        <option>เส้น</option>
        <option>กล่อง</option>
      </select>

      <label>ตำแหน่งจัดเก็บ</label>
      <input id="location" placeholder="เช่น ห้องเก็บของ">

      <label>หมายเหตุ</label>
      <textarea id="note" placeholder="รายละเอียดเพิ่มเติม"></textarea>

      <button class="btn-add" onclick="addItem()">💾 บันทึกอุปกรณ์</button>
      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


  <!-- เบิกอุปกรณ์ -->
  <div id="issuePage" class="hidden">
    <div class="card">
      <h2>📤 เบิกอุปกรณ์</h2>

      <label>เลือกอุปกรณ์ *</label>
      <select id="issueItem"></select>

      <label>จำนวนที่เบิก *</label>
      <input id="issueQuantity" type="number" min="1" placeholder="จำนวน">

      <label>ผู้เบิก</label>
      <input id="issuePerson" placeholder="ชื่อผู้เบิก">

      <label>จุดใช้งาน / หน้างาน</label>
      <input id="issueLocation" placeholder="เช่น ทล.1 กม.121">

      <label>หมายเหตุ</label>
      <textarea id="issueNote" placeholder="รายละเอียดเพิ่มเติม"></textarea>

      <button class="btn-issue" onclick="issueItem()">✅ ยืนยันการเบิก</button>
      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


  <!-- รายการสต๊อก -->
  <div id="stockPage" class="hidden">
    <div class="card">
      <h2>📦 รายการอุปกรณ์</h2>

      <input id="search" placeholder="🔎 ค้นหาอุปกรณ์..." oninput="renderStock()">

      <div id="stockList"></div>

      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


  <!-- ประวัติการเบิก -->
  <div id="historyPage" class="hidden">
    <div class="card">
      <h2>📋 ประวัติการเบิก</h2>

      <div id="historyList"></div>

      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


  <!-- รับอุปกรณ์เข้า -->
  <div id="receivePage" class="hidden">
    <div class="card">
      <h2>📥 รับอุปกรณ์เข้า</h2>

      <label>เลือกอุปกรณ์ *</label>
      <select id="receiveItem"></select>

      <label>จำนวนที่รับเข้า *</label>
      <input id="receiveQuantity" type="number" min="1" placeholder="จำนวน">

      <label>ผู้รับเข้า</label>
      <input id="receivePerson" placeholder="ชื่อผู้รับเข้า">

      <label>หมายเหตุ</label>
      <textarea id="receiveNote" placeholder="เช่น รับของจากบริษัท / ซื้อเพิ่ม"></textarea>

      <button class="btn-add" onclick="receiveItem()">✅ ยืนยันรับเข้า</button>
      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


  <!-- ประวัติการรับเข้า -->
  <div id="receiveHistoryPage" class="hidden">
    <div class="card">
      <h2>📋 ประวัติการรับเข้า</h2>

      <div id="receiveHistoryList"></div>

      <button class="btn-back" onclick="showPage('homePage')">↩️ กลับ</button>
    </div>
  </div>


 <!-- นำเข้า Excel -->
  <div id="importPage" class="hidden">
    <div class="card">

      <h2>📥 นำเข้าอุปกรณ์จาก Excel</h2>

      <p>เลือกไฟล์ Excel ที่ต้องการนำเข้า</p>

      <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls"
        onchange="previewExcel()"
      >

      <div id="excelPreview"></div>

      <button
        id="importExcelButton"
        class="btn-add hidden"
        onclick="importExcel()"
      >
        📦 นำเข้าสินค้าทั้งหมด
      </button>

      <button
        class="btn-back"
        onclick="showPage('homePage')"
      >
        ↩️ กลับ
      </button>

    </div>
  </div>
  
</div>


<script>

let stock = JSON.parse(localStorage.getItem("fieldStock")) || [];


/* เปลี่ยนหน้า */
function showPage(pageId) {

  const pages = [
    "homePage",
    "addPage",
    "issuePage",
    "stockPage",
    "historyPage",
    "receivePage",
    "receiveHistoryPage"
    "importPage"
  ];

  pages.forEach(id => {
    const page = document.getElementById(id);
    if (page) page.classList.add("hidden");
  });

  const target = document.getElementById(pageId);

  if (target) {
    target.classList.remove("hidden");
  }

  updateSummary();
}


/* เพิ่มอุปกรณ์ */
function addItem() {

  const name = document.getElementById("name").value.trim();
  const model = document.getElementById("model").value.trim();
  const quantity = Number(document.getElementById("quantity").value);
  const unit = document.getElementById("unit").value;
  const location = document.getElementById("location").value.trim();
  const note = document.getElementById("note").value.trim();

  if (!name) {
    alert("กรุณากรอกชื่ออุปกรณ์");
    return;
  }

  if (!quantity || quantity <= 0) {
    alert("กรุณากรอกจำนวนให้ถูกต้อง");
    return;
  }

  const item = {
    id: Date.now(),
    name,
    model,
    quantity,
    unit,
    location,
    note,
    createdAt: new Date().toLocaleString("th-TH")
  };

  stock.push(item);

  saveStock();

  document.getElementById("name").value = "";
  document.getElementById("model").value = "";
  document.getElementById("quantity").value = "";
  document.getElementById("location").value = "";
  document.getElementById("note").value = "";

  alert("เพิ่มอุปกรณ์เรียบร้อยแล้ว");

  showStock();
}


/* เปิดหน้าเบิก */
function showIssuePage() {

  const select = document.getElementById("issueItem");

  select.innerHTML = "";

  if (stock.length === 0) {

    const option = document.createElement("option");
    option.textContent = "ยังไม่มีอุปกรณ์ในสต๊อก";
    option.value = "";
    select.appendChild(option);

  } else {

    stock.forEach(item => {

      const option = document.createElement("option");

      option.value = item.id;

      option.textContent =
        item.name +
        (item.model ? " (" + item.model + ")" : "") +
        " — คงเหลือ " +
        item.quantity +
        " " +
        item.unit;

      select.appendChild(option);
    });
  }

  showPage("issuePage");
}


/* เบิกอุปกรณ์ */
function issueItem() {

  const itemId = Number(
    document.getElementById("issueItem").value
  );

  const quantity = Number(
    document.getElementById("issueQuantity").value
  );

  const person =
    document.getElementById("issuePerson").value.trim();

  const location =
    document.getElementById("issueLocation").value.trim();

  const note =
    document.getElementById("issueNote").value.trim();

  const item = stock.find(x => x.id === itemId);

  if (!item) {
    alert("กรุณาเลือกอุปกรณ์");
    return;
  }

  if (!quantity || quantity <= 0) {
    alert("กรุณากรอกจำนวนที่ต้องการเบิก");
    return;
  }

  if (quantity > item.quantity) {
    alert(
      "จำนวนไม่เพียงพอ\nคงเหลือ " +
      item.quantity + " " + item.unit
    );
    return;
  }

  item.quantity -= quantity;

  const issueHistory =
    JSON.parse(localStorage.getItem("issueHistory")) || [];

  issueHistory.push({
    id: Date.now(),
    itemId: item.id,
    itemName: item.name,
    model: item.model,
    quantity: quantity,
    unit: item.unit,
    remaining: item.quantity,
    person: person,
    location: location,
    note: note,
    date: new Date().toLocaleString("th-TH")
  });

  localStorage.setItem(
    "issueHistory",
    JSON.stringify(issueHistory)
  );

  saveStock();

  alert(
    "เบิกอุปกรณ์เรียบร้อยแล้ว\n\n" +
    item.name + "\n" +
    "เบิก " + quantity + " " + item.unit + "\n" +
    "คงเหลือ " + item.quantity + " " + item.unit
  );

  document.getElementById("issueQuantity").value = "";
  document.getElementById("issuePerson").value = "";
  document.getElementById("issueLocation").value = "";
  document.getElementById("issueNote").value = "";

  showStock();
}


/* แสดงสต๊อก */
function showStock() {
  showPage("stockPage");
  renderStock();
}


/* วาดรายการสต๊อก */
function renderStock() {

  const search =
    document.getElementById("search")?.value.toLowerCase() || "";

  const list = document.getElementById("stockList");

  if (!list) return;

  list.innerHTML = "";

  const filtered = stock.filter(item =>
    String(item.name || "").toLowerCase().includes(search) ||
    String(item.model || "").toLowerCase().includes(search)
  );

  if (filtered.length === 0) {

    list.innerHTML = "<p>ไม่พบอุปกรณ์</p>";

  } else {

    filtered.forEach(item => {

      const div = document.createElement("div");

      div.className = "item";

      div.innerHTML = `
        <strong>📦 ${item.name}</strong><br>
        ${item.model ? "รุ่น: " + item.model + "<br>" : ""}
        <b>คงเหลือ: ${item.quantity} ${item.unit}</b><br>
        ${item.location ? "📍 " + item.location + "<br>" : ""}
        ${item.note ? "📝 " + item.note : ""}
      `;

      list.appendChild(div);
    });
  }
}


/* แสดงประวัติการเบิก */
function showHistory() {

  const list = document.getElementById("historyList");

  if (!list) return;

  list.innerHTML = "";

  const issueHistory =
    JSON.parse(localStorage.getItem("issueHistory")) || [];

  if (issueHistory.length === 0) {

    list.innerHTML = "<p>ยังไม่มีประวัติการเบิก</p>";

  } else {

    issueHistory
      .slice()
      .reverse()
      .forEach(history => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
          <strong>📦 ${history.itemName}</strong><br>
          ${history.model ? "รุ่น: " + history.model + "<br>" : ""}
          <b>เบิก: ${history.quantity} ${history.unit}</b><br>
          📊 คงเหลือหลังเบิก: ${history.remaining} ${history.unit}<br>
          ${history.person ? "👤 ผู้เบิก: " + history.person + "<br>" : ""}
          ${history.location ? "📍 หน้างาน: " + history.location + "<br>" : ""}
          🕐 วันที่: ${history.date}<br>
          ${history.note ? "📝 " + history.note : ""}
        `;

        list.appendChild(div);
      });
  }

  showPage("historyPage");
}


/* เปิดหน้ารับอุปกรณ์ */
function showReceivePage() {

  const select = document.getElementById("receiveItem");

  select.innerHTML = "";

  if (stock.length === 0) {

    const option = document.createElement("option");
    option.textContent = "ยังไม่มีอุปกรณ์ในสต๊อก";
    option.value = "";
    select.appendChild(option);

  } else {

    stock.forEach(item => {

      const option = document.createElement("option");

      option.value = item.id;

      option.textContent =
        item.name +
        (item.model ? " (" + item.model + ")" : "") +
        " — คงเหลือ " +
        item.quantity +
        " " +
        item.unit;

      select.appendChild(option);
    });
  }

  showPage("receivePage");
}


/* รับอุปกรณ์เข้า */
function receiveItem() {

  const itemId = Number(
    document.getElementById("receiveItem").value
  );

  const quantity = Number(
    document.getElementById("receiveQuantity").value
  );

  const person =
    document.getElementById("receivePerson").value.trim();

  const note =
    document.getElementById("receiveNote").value.trim();

  const item = stock.find(x => x.id === itemId);

  if (!item) {
    alert("กรุณาเลือกอุปกรณ์");
    return;
  }

  if (!quantity || quantity <= 0) {
    alert("กรุณากรอกจำนวนที่ต้องการรับเข้า");
    return;
  }

  item.quantity += quantity;

  const receiveHistory =
    JSON.parse(localStorage.getItem("receiveHistory")) || [];

  receiveHistory.push({
    id: Date.now(),
    itemId: item.id,
    itemName: item.name,
    model: item.model,
    quantity: quantity,
    unit: item.unit,
    remaining: item.quantity,
    person: person,
    note: note,
    date: new Date().toLocaleString("th-TH")
  });

  localStorage.setItem(
    "receiveHistory",
    JSON.stringify(receiveHistory)
  );

  saveStock();

  alert(
    "รับอุปกรณ์เข้าเรียบร้อยแล้ว\n\n" +
    item.name + "\n" +
    "รับเข้า " + quantity + " " + item.unit + "\n" +
    "คงเหลือ " + item.quantity + " " + item.unit
  );

  document.getElementById("receiveQuantity").value = "";
  document.getElementById("receivePerson").value = "";
  document.getElementById("receiveNote").value = "";

  showStock();
}


/* แสดงประวัติการรับเข้า */
function showReceiveHistory() {

  const list =
    document.getElementById("receiveHistoryList");

  if (!list) return;

  list.innerHTML = "";

  const receiveHistory =
    JSON.parse(localStorage.getItem("receiveHistory")) || [];

  if (receiveHistory.length === 0) {

    list.innerHTML =
      "<p>ยังไม่มีประวัติการรับเข้า</p>";

  } else {

    receiveHistory
      .slice()
      .reverse()
      .forEach(history => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
          <strong>📦 ${history.itemName}</strong><br>
          ${history.model ? "รุ่น: " + history.model + "<br>" : ""}
          <b>รับเข้า: ${history.quantity} ${history.unit}</b><br>
          ${history.person ? "👤 ผู้รับเข้า: " + history.person + "<br>" : ""}
          📊 คงเหลือหลังรับเข้า: ${history.remaining} ${history.unit}<br>
          🕐 วันที่: ${history.date}<br>
          ${history.note ? "📝 " + history.note : ""}
        `;

        list.appendChild(div);
      });
  }

  showPage("receiveHistoryPage");
}

/* =========================
   ระบบนำเข้า Excel
========================= */

let excelData = [];


/* เปิดหน้านำเข้า Excel */
function showImportPage() {

  excelData = [];

  document.getElementById("excelFile").value = "";
  document.getElementById("excelPreview").innerHTML = "";

  document
    .getElementById("importExcelButton")
    .classList.add("hidden");

  showPage("importPage");
}

/* อ่านไฟล์ Excel */
function previewExcel() {

  const fileInput =
    document.getElementById("excelFile");

  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {

    try {

      const data =
        new Uint8Array(e.target.result);

      const workbook =
        XLSX.read(data, {
          type: "array"
        });

      const sheetName =
        workbook.SheetNames[0];

      const worksheet =
        workbook.Sheets[sheetName];

      const rows =
        XLSX.utils.sheet_to_json(
          worksheet,
          { defval: "" }
        );

      if (rows.length === 0) {

        alert("ไม่พบข้อมูลในไฟล์ Excel");

        return;
      }

      excelData = rows.map(row => {

        return {

          name:
            String(
              row["ชื่ออุปกรณ์"] || ""
            ).trim(),

          model:
            String(
              row["รุ่น"] ||
              row["รุ่น / Model"] ||
              ""
            ).trim(),

          quantity:
            Number(
              row["จำนวน"] || 0
            ),

          unit:
            String(
              row["หน่วย"] ||
              "ชิ้น"
            ).trim(),

          location:
            String(
              row["ตำแหน่งจัดเก็บ"] ||
              row["สถานที่"] ||
              ""
            ).trim(),

          note:
            String(
              row["หมายเหตุ"] || ""
            ).trim()

        };

      });

      showExcelPreview();

    } catch (error) {

      console.error(error);

      alert(
        "ไม่สามารถอ่านไฟล์ Excel ได้"
      );

    }

  };

  reader.readAsArrayBuffer(file);
}

/* แสดงตัวอย่างข้อมูล Excel */
function showExcelPreview() {

  const preview =
    document.getElementById("excelPreview");

  if (!excelData || excelData.length === 0) {

    preview.innerHTML =
      "<p>ไม่พบข้อมูล</p>";

    return;
  }

  let html = `
    <h3>ตัวอย่างข้อมูลที่จะนำเข้า</h3>

    <div style="overflow-x:auto;">
      <table border="1" cellpadding="8" cellspacing="0"
             style="width:100%; border-collapse:collapse;">

        <tr>
          <th>ชื่ออุปกรณ์</th>
          <th>รุ่น</th>
          <th>จำนวน</th>
          <th>หน่วย</th>
          <th>ตำแหน่งจัดเก็บ</th>
          <th>หมายเหตุ</th>
        </tr>
  `;

  excelData.forEach(row => {

    html += `
      <tr>

        <td>${row.name}</td>

        <td>${row.model}</td>

        <td>${row.quantity}</td>

        <td>${row.unit}</td>

        <td>${row.location}</td>

        <td>${row.note}</td>

      </tr>
    `;

  });

  html += `
      </table>
    </div>

    <p>
      พบข้อมูลทั้งหมด
      <strong>${excelData.length}</strong>
      รายการ
    </p>
  `;

  preview.innerHTML = html;

  document
    .getElementById("importExcelButton")
    .classList.remove("hidden");
}
  
/* นำเข้าข้อมูลจาก Excel */
function importExcel() {

  if (!excelData || excelData.length === 0) {

    alert("ไม่พบข้อมูลสำหรับนำเข้า");

    return;
  }

  let importedCount = 0;

  excelData.forEach((row, index) => {

    // ข้ามแถวที่ไม่มีชื่ออุปกรณ์
    if (!row.name) {
      return;
    }

    // ตรวจสอบว่ามีอุปกรณ์นี้อยู่แล้วหรือไม่
    const existingItem = stock.find(item =>
      String(item.name).trim().toLowerCase() ===
        String(row.name).trim().toLowerCase()
      &&
      String(item.model || "").trim().toLowerCase() ===
        String(row.model || "").trim().toLowerCase()
    );

    if (existingItem) {

      // ถ้ามีอยู่แล้ว ให้เพิ่มจำนวนเข้าไป
      existingItem.quantity += row.quantity;

    } else {

      // ถ้ายังไม่มี ให้สร้างรายการใหม่
      stock.push({

        id: Date.now() + index,

        name: row.name,

        model: row.model,

        quantity: row.quantity,

        unit: row.unit || "ชิ้น",

        location: row.location,

        note: row.note,

        createdAt: new Date().toLocaleString("th-TH")

      });

    }

    // บันทึกประวัติรับเข้า
    const receiveHistory =
      JSON.parse(
        localStorage.getItem("receiveHistory")
      ) || [];

    receiveHistory.push({

      id: Date.now() + index,

      itemName: row.name,

      quantity: row.quantity,

      person: "นำเข้าจาก Excel",

      note: row.note || "",

      date: new Date().toLocaleString("th-TH")

    });

    localStorage.setItem(
      "receiveHistory",
      JSON.stringify(receiveHistory)
    );

    importedCount++;

  });

  // บันทึกสต๊อก
  saveStock();

  alert(
    "นำเข้าข้อมูลสำเร็จ\n" +
    "จำนวน " +
    importedCount +
    " รายการ"
  );

  // กลับหน้าหลัก
  showPage("homePage");

}

  
/* บันทึกสต๊อก */
function saveStock() {

  localStorage.setItem(
    "fieldStock",
    JSON.stringify(stock)
  );

  updateSummary();
}


/* สรุปจำนวน */
function updateSummary() {

  const itemCount =
    document.getElementById("itemCount");

  const totalQuantity =
    document.getElementById("totalQuantity");

  if (!itemCount || !totalQuantity) return;

  itemCount.textContent = stock.length;

  totalQuantity.textContent =
    stock.reduce(
      (sum, item) => sum + Number(item.quantity || 0),
      0
    );
}


/* เริ่มต้นระบบ */
updateSummary();

</script>
