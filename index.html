<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Stock</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

.header {
  background: #1f2937;
  color: white;
  padding: 20px;
  text-align: center;
}

.header h1 {
  margin: 0 0 5px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.btn-add {
  background: #16a34a;
  color: white;
}

.btn-issue {
  background: #dc2626;
  color: white;
}

.btn-list {
  background: #2563eb;
  color: white;
}

.btn-back {
  background: #6b7280;
  color: white;
}

input, select, textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  margin-bottom: 12px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 15px;
}

label {
  font-weight: bold;
}

.item {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}

.item strong {
  font-size: 17px;
}

.hidden {
  display: none;
}

.summary {
  display: flex;
  gap: 10px;
}

.summary-box {
  flex: 1;
  background: #f9fafb;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
}

.summary-number {
  font-size: 24px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>📦 Field Stock</h1>
  <div>ระบบจัดการสต๊อกอุปกรณ์ภาคสนาม</div>
</div>

<div class="container">

  <!-- หน้าหลัก -->
  <div id="homePage">

    <div class="card">
      <h2>📋 จัดการสต๊อก</h2>

      <button class="btn-add" onclick="showPage('addPage')">
        ➕ เพิ่มอุปกรณ์
      </button>

      <button class="btn-issue" onclick="showIssuePage()">
        📤 เบิกอุปกรณ์
      </button>

      <button class="btn-list" onclick="showStock()">
        📦 ดูรายการอุปกรณ์
      </button>

      <button class="btn-list" onclick="showHistory()">
        📋 ประวัติการเบิก
      </button>

    </div>

    <div class="card">
      <h2>📊 สรุปสต๊อก</h2>

      <div class="summary">
        <div class="summary-box">
          <div>รายการ</div>
          <div class="summary-number" id="itemCount">0</div>
        </div>

        <div class="summary-box">
          <div>จำนวนรวม</div>
          <div class="summary-number" id="totalQuantity">0</div>
        </div>
      </div>
    </div>

  </div>


  <!-- เพิ่มอุปกรณ์ -->
  <div id="addPage" class="hidden">

    <div class="card">
      <h2>➕ เพิ่มอุปกรณ์</h2>

      <label>ชื่ออุปกรณ์ *</label>
      <input id="name" placeholder="เช่น MRV336">

      <label>รุ่น / Model</label>
      <input id="model" placeholder="เช่น MRV336">

      <label>จำนวน *</label>
      <input id="quantity" type="number" min="1" placeholder="จำนวน">

      <label>หน่วย</label>
      <select id="unit">
        <option>ชิ้น</option>
        <option>ตัว</option>
        <option>ชุด</option>
        <option>อัน</option>
        <option>เส้น</option>
        <option>กล่อง</option>
      </select>

      <label>ตำแหน่งจัดเก็บ</label>
      <input id="location" placeholder="เช่น ห้องเก็บของ">

      <label>หมายเหตุ</label>
      <textarea id="note" placeholder="รายละเอียดเพิ่มเติม"></textarea>

      <button class="btn-add" onclick="addItem()">
        💾 บันทึกอุปกรณ์
      </button>

      <button class="btn-back" onclick="showPage('homePage')">
        ↩️ กลับ
      </button>
    </div>

  </div>


  <!-- เบิกอุปกรณ์ -->
  <div id="issuePage" class="hidden">

    <div class="card">
      <h2>📤 เบิกอุปกรณ์</h2>

      <label>เลือกอุปกรณ์ *</label>
      <select id="issueItem"></select>

      <label>จำนวนที่เบิก *</label>
      <input id="issueQuantity" type="number" min="1" placeholder="จำนวน">

      <label>ผู้เบิก</label>
      <input id="issuePerson" placeholder="ชื่อผู้เบิก">

      <label>จุดใช้งาน / หน้างาน</label>
      <input id="issueLocation" placeholder="เช่น ทล.1 กม.121">

      <label>หมายเหตุ</label>
      <textarea id="issueNote" placeholder="รายละเอียดเพิ่มเติม"></textarea>

      <button class="btn-issue" onclick="issueItem()">
        ✅ ยืนยันการเบิก
      </button>

      <button class="btn-back" onclick="showPage('homePage')">
        ↩️ กลับ
      </button>
    </div>

  </div>


  <!-- รายการสต๊อก -->
  <div id="stockPage" class="hidden">

    <div class="card">
      <h2>📦 รายการอุปกรณ์</h2>

      <input
        id="search"
        placeholder="🔎 ค้นหาอุปกรณ์..."
        oninput="showStock()"
      >

      <div id="stockList"></div>

      <button class="btn-back" onclick="showPage('homePage')">
        ↩️ กลับ
      </button>
    </div>

  </div>

</div>
  
<!-- ประวัติการเบิก -->
<div id="historyPage" class="hidden">

  <div class="card">
    <h2>📋 ประวัติการเบิก</h2>

    <div id="historyList"></div>

    <button class="btn-back" onclick="showPage('homePage')">
      ↩️ กลับ
    </button>
  </div>

</div>

<script>

let stock = JSON.parse(localStorage.getItem("fieldStock")) || [];


/* เปลี่ยนหน้า */
function showPage(pageId) {

  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("addPage").classList.add("hidden");
  document.getElementById("issuePage").classList.add("hidden");
  document.getElementById("stockPage").classList.add("hidden");

  document.getElementById(pageId).classList.remove("hidden");

  updateSummary();
}


/* เพิ่มอุปกรณ์ */
function addItem() {

  const name = document.getElementById("name").value.trim();
  const model = document.getElementById("model").value.trim();
  const quantity = Number(document.getElementById("quantity").value);
  const unit = document.getElementById("unit").value;
  const location = document.getElementById("location").value.trim();
  const note = document.getElementById("note").value.trim();

  if (!name) {
    alert("กรุณากรอกชื่ออุปกรณ์");
    return;
  }

  if (!quantity || quantity <= 0) {
    alert("กรุณากรอกจำนวนให้ถูกต้อง");
    return;
  }

  const item = {
    id: Date.now(),
    name,
    model,
    quantity,
    unit,
    location,
    note,
    createdAt: new Date().toLocaleString("th-TH")
  };

  stock.push(item);

  saveStock();

  document.getElementById("name").value = "";
  document.getElementById("model").value = "";
  document.getElementById("quantity").value = "";
  document.getElementById("location").value = "";
  document.getElementById("note").value = "";

  alert("เพิ่มอุปกรณ์เรียบร้อยแล้ว");

  showStock();
}


/* เปิดหน้าเบิก */
function showIssuePage() {

  const select = document.getElementById("issueItem");

  select.innerHTML = "";

  if (stock.length === 0) {

    const option = document.createElement("option");
    option.textContent = "ยังไม่มีอุปกรณ์ในสต๊อก";
    option.value = "";

    select.appendChild(option);

  } else {

    stock.forEach(item => {

      const option = document.createElement("option");

      option.value = item.id;

      option.textContent =
        item.name +
        (item.model ? " (" + item.model + ")" : "") +
        " — คงเหลือ " +
        item.quantity +
        " " +
        item.unit;

      select.appendChild(option);

    });

  }

  showPage("issuePage");
}


/* เบิกอุปกรณ์ */
function issueItem() {

  const itemId = Number(document.getElementById("issueItem").value);
  const quantity = Number(document.getElementById("issueQuantity").value);

  const person =
    document.getElementById("issuePerson").value.trim();

  const location =
    document.getElementById("issueLocation").value.trim();

  const note =
    document.getElementById("issueNote").value.trim();

  const item = stock.find(x => x.id === itemId);

  if (!item) {
    alert("กรุณาเลือกอุปกรณ์");
    return;
  }

  if (!quantity || quantity <= 0) {
    alert("กรุณากรอกจำนวนที่ต้องการเบิก");
    return;
  }

  if (quantity > item.quantity) {
    alert(
      "จำนวนไม่เพียงพอ\n" +
      "คงเหลือ " +
      item.quantity +
      " " +
      item.unit
    );
    return;
  }


  /* ตัดสต๊อก */
  item.quantity -= quantity;


  /* บันทึกข้อมูลการเบิก */
  const issueHistory =
    JSON.parse(localStorage.getItem("issueHistory")) || [];

  issueHistory.push({
    id: Date.now(),
    itemId: item.id,
    itemName: item.name,
    model: item.model,
    quantity: quantity,
    unit: item.unit,
    person: person,
    location: location,
    note: note,
    date: new Date().toLocaleString("th-TH")
  });

  localStorage.setItem(
    "issueHistory",
    JSON.stringify(issueHistory)
  );


  saveStock();


  alert(
    "เบิกอุปกรณ์เรียบร้อยแล้ว\n\n" +
    item.name +
    "\n" +
    "เบิก " +
    quantity +
    " " +
    item.unit +
    "\n" +
    "คงเหลือ " +
    item.quantity +
    " " +
    item.unit
  );


  document.getElementById("issueQuantity").value = "";
  document.getElementById("issuePerson").value = "";
  document.getElementById("issueLocation").value = "";
  document.getElementById("issueNote").value = "";

  showStock();
}


/* แสดงสต๊อก */
function showStock() {

  const search =
    document.getElementById("search")?.value.toLowerCase() || "";

  const list =
    document.getElementById("stockList");

  if (!list) return;

  list.innerHTML = "";

  const filtered =
    stock.filter(item =>
      item.name.toLowerCase().includes(search) ||
      item.model.toLowerCase().includes(search)
    );


  if (filtered.length === 0) {

    list.innerHTML =
      "<p>ไม่พบอุปกรณ์</p>";

  } else {

    filtered.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "item";

      div.innerHTML = `
        <strong>📦 ${item.name}</strong><br>
        ${item.model ? "รุ่น: " + item.model + "<br>" : ""}
        <b>คงเหลือ: ${item.quantity} ${item.unit}</b><br>
        ${item.location ? "📍 " + item.location + "<br>" : ""}
        ${item.note ? "📝 " + item.note : ""}
      `;

      list.appendChild(div);

    });

  }

  showPage("stockPage");
}


/* บันทึกสต๊อก */
function saveStock() {

  localStorage.setItem(
    "fieldStock",
    JSON.stringify(stock)
  );

  updateSummary();
}


/* สรุปจำนวน */
function updateSummary() {

  const itemCount =
    document.getElementById("itemCount");

  const totalQuantity =
    document.getElementById("totalQuantity");

  if (!itemCount || !totalQuantity) return;

  itemCount.textContent = stock.length;

  totalQuantity.textContent =
    stock.reduce(
      (sum, item) => sum + Number(item.quantity || 0),
      0
    );
}


/* เริ่มต้นระบบ */
updateSummary();

</script>

</body>
</html>
