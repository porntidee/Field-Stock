<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Stock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #1565c0;
      color: white;
      padding: 20px 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 19px;
    }

    label {
      display: block;
      font-size: 14px;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8dce0;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px;
      margin-top: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-primary {
      background: #1565c0;
      color: white;
    }

    .btn-secondary {
      background: #e9eef5;
      color: #333;
    }

    .stock-item {
      border: 1px solid #e0e4e8;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .stock-name {
      font-size: 17px;
      font-weight: bold;
    }

    .stock-detail {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
      line-height: 1.6;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }

    .hidden {
      display: none;
    }

    .summary {
      display: flex;
      gap: 10px;
    }

    .summary-box {
      flex: 1;
      background: #f1f5f9;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
    }

    .summary-number {
      display: block;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📦 Field Stock</h1>
    <p>ระบบจัดการสต๊อกอุปกรณ์ภาคสนาม</p>
  </div>

  <div class="container">

    <!-- เมนู -->
    <div class="card">
      <h2>📋 จัดการสต๊อก</h2>

      <button class="btn btn-primary" onclick="showAddForm()">
        ➕ เพิ่มอุปกรณ์
      </button>

      <button class="btn btn-secondary" onclick="showStock()">
        📦 ดูรายการอุปกรณ์
      </button>
    </div>


    <!-- สรุป -->
    <div class="card">
      <h2>📊 สรุปสต๊อก</h2>

      <div class="summary">

        <div class="summary-box">
          <span class="summary-number" id="itemCount">0</span>
          รายการ
        </div>

        <div class="summary-box">
          <span class="summary-number" id="totalQty">0</span>
          ชิ้น
        </div>

      </div>
    </div>


    <!-- เพิ่มอุปกรณ์ -->
    <div class="card hidden" id="addForm">

      <h2>➕ เพิ่มอุปกรณ์</h2>

      <label>ชื่ออุปกรณ์ *</label>
      <input
        type="text"
        id="name"
        placeholder="เช่น Receiving Card"
      >

      <label>รุ่น / Model</label>
      <input
        type="text"
        id="model"
        placeholder="เช่น MRV336"
      >

      <label>จำนวน *</label>
      <input
        type="number"
        id="quantity"
        min="1"
        placeholder="เช่น 10"
      >

      <label>หน่วย</label>
      <select id="unit">
        <option value="ชิ้น">ชิ้น</option>
        <option value="ตัว">ตัว</option>
        <option value="ชุด">ชุด</option>
        <option value="อัน">อัน</option>
        <option value="เส้น">เส้น</option>
        <option value="กล่อง">กล่อง</option>
      </select>

      <label>ตำแหน่งจัดเก็บ</label>
      <input
        type="text"
        id="location"
        placeholder="เช่น ห้องเก็บของ / ตู้ A"
      >

      <label>หมายเหตุ</label>
      <textarea
        id="note"
        placeholder="รายละเอียดเพิ่มเติม"
      ></textarea>

      <button
        class="btn btn-primary"
        onclick="addEquipment()">
        💾 บันทึกอุปกรณ์
      </button>

      <button
        class="btn btn-secondary"
        onclick="hideAddForm()">
        ยกเลิก
      </button>

    </div>


    <!-- รายการอุปกรณ์ -->
    <div class="card hidden" id="stockPage">

      <h2>📦 รายการอุปกรณ์</h2>

      <input
        type="text"
        id="search"
        placeholder="🔎 ค้นหาอุปกรณ์..."
        oninput="showStock()"
      >

      <br><br>

      <div id="stockList"></div>

    </div>

  </div>


<script>

  // โหลดข้อมูลจากเครื่อง
  let equipment =
    JSON.parse(localStorage.getItem("fieldStock")) || [];


  // บันทึกข้อมูล
  function saveData() {

    localStorage.setItem(
      "fieldStock",
      JSON.stringify(equipment)
    );

  }


  // เปิดหน้าเพิ่มอุปกรณ์
  function showAddForm() {

    document
      .getElementById("addForm")
      .classList.remove("hidden");

    document
      .getElementById("stockPage")
      .classList.add("hidden");

    window.scrollTo({
      top: document.getElementById("addForm").offsetTop,
      behavior: "smooth"
    });

  }


  // ปิดหน้าเพิ่ม
  function hideAddForm() {

    document
      .getElementById("addForm")
      .classList.add("hidden");

  }


  // เพิ่มอุปกรณ์
  function addEquipment() {

    const name =
      document.getElementById("name").value.trim();

    const model =
      document.getElementById("model").value.trim();

    const quantity =
      Number(document.getElementById("quantity").value);

    const unit =
      document.getElementById("unit").value;

    const location =
      document.getElementById("location").value.trim();

    const note =
      document.getElementById("note").value.trim();


    // ตรวจสอบข้อมูล
    if (!name) {

      alert("กรุณากรอกชื่ออุปกรณ์");

      return;
    }


    if (!quantity || quantity < 1) {

      alert("กรุณากรอกจำนวนให้ถูกต้อง");

      return;
    }


    // สร้างรายการใหม่
    const newEquipment = {

      id: Date.now(),

      name: name,

      model: model,

      quantity: quantity,

      unit: unit,

      location: location,

      note: note,

      createdAt:
        new Date().toLocaleString("th-TH")

    };


    equipment.push(newEquipment);


    // บันทึก
    saveData();


    // ล้างแบบฟอร์ม
    document.getElementById("name").value = "";
    document.getElementById("model").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("location").value = "";
    document.getElementById("note").value = "";


    updateSummary();


    alert("เพิ่มอุปกรณ์เรียบร้อยแล้ว");


    showStock();

  }


  // แสดงรายการ
  function showStock() {

    document
      .getElementById("stockPage")
      .classList.remove("hidden");


    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    const list =
      document.getElementById("stockList");


    const filtered =
      equipment.filter(item =>

        item.name
          .toLowerCase()
          .includes(search)

        ||

        item.model
          .toLowerCase()
          .includes(search)

      );


    list.innerHTML = "";


    if (filtered.length === 0) {

      list.innerHTML =
        '<div class="empty">ยังไม่มีอุปกรณ์ในสต๊อก</div>';

      return;
    }


    filtered.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "stock-item";


      div.innerHTML = `

        <div class="stock-name">
          ${item.name}
        </div>

        <div class="stock-detail">

          รุ่น: ${item.model || "-"}<br>

          จำนวน: <b>
            ${item.quantity}
          </b> ${item.unit}<br>

          จัดเก็บที่:
          ${item.location || "-"}<br>

          หมายเหตุ:
          ${item.note || "-"}<br>

          เพิ่มเมื่อ:
          ${item.createdAt}

        </div>

      `;


      list.appendChild(div);

    });


    updateSummary();

  }


  // สรุปจำนวน
  function updateSummary() {

    const itemCount =
      equipment.length;


    const totalQty =
      equipment.reduce(

        (sum, item) =>
          sum + Number(item.quantity),

        0

      );


    document
      .getElementById("itemCount")
      .textContent = itemCount;


    document
      .getElementById("totalQty")
      .textContent = totalQty;

  }


  // เริ่มต้น
  updateSummary();

</script>

</body>
</html>
